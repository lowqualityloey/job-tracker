name: CI

# DEBT-03, closed by execution rather than by intention. Everything below is the same command a human
# runs locally: CI's job is not to define a second, slightly different standard, but to run the one in
# `package.json` at moments when nobody is remembering to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow builds and checks. It never deploys, publishes, or writes to the repository,
# because tagging, releasing, and pushing to `main` are human decisions (`AGENTS.md` §Branch & PR workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 24 to match the measured local runtime (`node -v` → v24.20.0 on 2026-09-11), not whatever
      # the runner happens to default to. A CI that passes on a different major than the developer's
      # machine is a source of bugs nobody can reproduce.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` rather than `npm install`: it refuses to proceed when `package.json` and
      # `package-lock.json` disagree, which is the one guard against an accidental dependency change
      # that no local command provides.
      - name: Install (lockfile-exact)
        run: npm ci

      - name: Verify (typecheck → lint → stylelint → tests → build)
        run: npm run verify

      # -076: AC-14's budget, checked on every pull request rather than remembered. `-065` measured the number once and
      # nothing has verified it since (`grep -c bundleDelta .github/workflows/ci.yml` → 0 before this step existed), so a
      # dependency bump of ~2 kB would reach `main` with every job green while AC-14 stayed a checked box describing a
      # build that no longer exists. This is a second full build per PR — the cost `-076` names and accepts; the thing it
      # buys is that the acceptance criterion is now a gate instead of a recollection.
      - name: Bundle gate (AC-14, -076)
        run: bash tests/build/bundleGate.sh

      # Permanent teeth for DEBT-11. `tsc -b` (inside `npm run build`) emits next to its inputs unless
      # `tsconfig.node.json` keeps `"noEmit": true`; the emitted `vite.config.js` then shadows the real
      # `vite.config.ts` for `vite dev`/`vite build` — Vite resolves `.js` before `.ts` — while Vitest
      # keeps reading the `.ts`. Tests stay green; the app silently runs a stale config. `bd8a8b6` closed
      # it, and this step is what stops it from coming back as a regression nobody notices.
      - name: Assert the build did not emit a config shadow (DEBT-11)
        run: |
          set -euo pipefail
          for f in vite.config.js vite.config.d.ts; do
            if [ -e "$f" ]; then
              echo "::error::$f exists after the build. tsconfig.node.json lost \"noEmit\": true — the emitted copy now shadows vite.config.ts for vite dev/build. See DEBT-11 in docs/STATE.md."
              exit 1
            fi
          done
          # Any other visible file means the build wrote into the tree: `*.tsbuildinfo` and `dist/` are
          # gitignored on purpose, so an entry here is something new and unexplained.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build left changes visible to git:"
            git status --porcelain
            exit 1
          fi
          echo "✓ no config shadow, no leaked build output"

  # -076's other half. `bundleGate.sh` compares against a fixture because a per-PR job cannot afford four builds and has
  # no history checked out (`actions/checkout` defaults to depth 1). This job is the counterweight: manually triggered,
  # full history, and it rebuilds the baseline commit itself — the `-065` procedure, kept runnable so the fixture cannot
  # rot quietly. What it asserts, precisely: `bundleDelta.sh` rebuilds `41b32af` and the head in one run and fails if the
  # head's delta breaches the budget — and it only *prints* how far the reproduced baseline sits from `-065`'s figures.
  # The fixture-vs-reproduction equality is therefore asserted here, from the machine-readable line the script emits, so
  # a baseline that has silently moved fails the job instead of appearing as a curious number in a log. Two different
  # checks, one per script: `bundleGate.sh` asks "did the app grow", this job asks "is the number the gate trusts still
  # the number history produces".
  bundle-baseline-recheck:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Rebuild the baseline commit and the head in one run
        env:
          RESULT_FILE: /tmp/bundle-recheck.env
        run: |
          set -euo pipefail
          bash tests/build/bundleDelta.sh
          . "$RESULT_FILE"
          fixture=$(node -e 'process.stdout.write(String(require("./tests/build/bundle-baseline.json").flag_on_bytes))')
          echo "reproduced baseline=$REPRODUCED_BASELINE_ON_B at $BASE_COMMIT_REF · fixture says $fixture · head=$HEAD_ON_B"
          if [ "$REPRODUCED_BASELINE_ON_B" != "$fixture" ]; then
            echo "::error::the committed baseline no longer reproduces ($REPRODUCED_BASELINE_ON_B vs $fixture B at $URL_LITERAL_B). The per-PR gate is comparing the head against a number that history does not produce — update tests/build/bundle-baseline.json from tests/build/bundleDelta.sh output and say why in the commit."
            exit 1
          fi
          echo "✓ fixture still reproduces byte-exact; the gate's baseline is honest"
          if [ $((HEAD_ON_B - REPRODUCED_BASELINE_ON_B)) -ge 3072 ]; then
            echo "::error::head exceeds AC-14's budget by the re-derived measure too ($(($(HEAD_ON_B - REPRODUCED_BASELINE_ON_B))) B)"
            exit 1
          fi

  # --- M3 Slice 0: the API gate --------------------------------------------------------------------
  #
  # Gated **internally** (a detection step + per-step `if:`) rather than by `on.pull_request.paths`, because
  # of grill finding F-10 in docs/reviews/2026-09-11-m3-plan-grill.md: a job excluded by a `paths:` filter
  # reports *no status at all*, which to required-status-check protection is indistinguishable from a check
  # that never ran. The day branch protection is enabled with "require all checks", every docs-only PR
  # becomes unmergeable, and the usual reflex is `if: always()` — which runs a job with no reason to exist.
  # Here the job always runs and always reports; only its steps skip. AC-13 in
  # docs/tasks/TASK-m3-backend-api.md asserts both outcomes on real pushes.
  api:
    name: verify-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the diff against the PR base has a merge base to compare against.
          fetch-depth: 0

      - name: Detect whether the API surface changed
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          else
            # Push to main or manual dispatch: examine the commit itself, so the job is never vacuously green.
            changed=$(git show --name-only --pretty=format: HEAD)
          fi
          # global.json and this workflow count as API surface: a toolchain pin change or a CI change must
          # re-prove the .NET build even if no .cs file moved.
          if printf '%s\n' "$changed" | grep -qE '^(api/|global\.json$|\.github/workflows/ci\.yml$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "✓ API surface changed — running the .NET gate"
            # The symmetric case: when it does run, say so in the same place, so the summary is informative in both
            # states instead of only advertising the skip.
            {
              echo "### verify-api: running"
              echo
              echo "API surface changed — build with warnings-as-errors and the full xUnit suite against a real PostgreSQL."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "✓ no API surface change — steps below skip, job still reports success"
            # Say the same thing where a reviewer will actually see it. A job whose real steps all skipped still
            # reports `success` — that is by design (grill F-10: an excluded *job* reports no status, which breaks
            # branch protection) — but "success" is read as "the .NET suite passed", and it happened to a session
            # that then filed a bug report against a gate that was working correctly. The step log has the line
            # above; nobody opens the log to decide whether a green check means anything.
            {
              echo "### verify-api: skipped"
              echo
              echo "No \`api/\`, \`global.json\`, or workflow path changed, so the .NET build and tests **did not run** on this commit."
              echo
              echo "The job reports \`success\` rather than \`skipped\` on purpose — see grill F-10 — so read this note, not the check mark."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          # Read the version from global.json instead of repeating the pin here: exactly one place holds it,
          # and that file's `rollForward: disable` is what turns a mismatch into a loud failure.
          global-json-file: global.json

      # `TreatWarningsAsErrors` makes the .NET gate match the frontend's `--max-warnings 0`: a warning nobody
      # reads is a warning nobody fixes. Slice 0's build is clean under it — 0 warnings, 0 errors — verified
      # locally on 2026-09-11 before this line was written.
      #
      # No `services:` block here: the tests start their own PostgreSQL 18.6 through Testcontainers, which is
      # exactly what this job's first run proves or refutes (UNCERTAINTY-m3-backend-api-008-001). If a runner
      # cannot, the fallback is a service container — a fixture swap, not a test rewrite.
      - name: Verify (build with warnings as errors → test against a real PostgreSQL)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          dotnet build api/JobTracker.slnx -p:TreatWarningsAsErrors=true
          dotnet test api/tests/JobTracker.Api.Tests
