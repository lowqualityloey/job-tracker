# Development database for the M3 API. Loopback-bound and never exposed (spec §5 reachability control:
# there is no authentication in M3, so *reachability* is the control until M4 provides ownership).
#
# This file is not a secret store. The password below exists so that `docker compose up` works on a
# developer machine with no setup; it guards a container on 127.0.0.1 holding nothing but local dev rows.
# The application's own connection string is deliberately NOT here — spec §5 keeps it in
# `dotnet user-secrets` or the environment, and `JobTrackerDbFactory` refuses to run without it rather
# than falling back to a credential it would have to guess at.
services:
  db:
    image: postgres:18.6 # exact major.minor, per DECISION-m3-backend-api-001 — not `latest`, not `18`
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker-dev-only
      POSTGRES_DB: jobtracker
    ports:
      - "127.0.0.1:5432:5432" # bound to loopback only; `:5432:5432` would answer on every interface
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # PostgreSQL 18+ images changed the expected mount point: data lives under a
      # major-version-specific directory, so the volume mounts at /var/lib/postgresql and NOT
      # /var/lib/postgresql/data. The legacy path makes the container exit(1) with
      # "there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused mount/volume)".
      # Verified by failure, not by documentation, on 2026-09-11 — see docs/STATE.md Slice 0 notes.
      - jt-pgdata:/var/lib/postgresql

volumes:
  jt-pgdata:
